apply {
    plugin "com.android.library"
    plugin "kotlin-android"
    plugin "maven-publish"
}

android {
    compileSdkVersion sdk
    defaultConfig {
        minSdkVersion minSdk
        versionCode 1
        versionName "1.30.6"
        consumerProguardFiles 'proguard-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            consumerProguardFiles 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.google.code.gson:gson:2.11.0'

    implementation "com.android.support:appcompat-v7:${support_version}"
    implementation "com.android.support:design:${support_version}"

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.3.1'
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testImplementation "com.android.support:appcompat-v7:${support_version}"
    testImplementation "com.android.support:design:${support_version}"
    testImplementation 'org.greenrobot:eventbus:3.1.1'
    testImplementation project(':utilcode')
}

publishing {
    publications {
        release(MavenPublication) {
            groupId = 'com.github.MrDon94'
            artifactId = 'utilcode'
            version = '1.0.0'

            afterEvaluate {
                from components.release
            }
        }
    }
}
